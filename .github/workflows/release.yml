name: Release

on:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  check:
    name: Build and test
    runs-on: ubuntu-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Build and test
        run: ./test_runner.sh

  release:
    name: Package and publish
    needs: check
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Check out pushed source and history
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Find release tags in pushed commits
        id: tags
        env:
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.event.after }}
        run: |
          git fetch --force --tags origin

          if [[ "$BEFORE" == "0000000000000000000000000000000000000000" ]]; then
            commits=("$AFTER")
          else
            commits=()
            while IFS= read -r commit; do
              commits+=("$commit")
            done < <(git rev-list "$BEFORE..$AFTER")
          fi

          release_tags=()
          for commit in "${commits[@]}"; do
            while IFS= read -r tag; do
              [[ "$tag" =~ ^v[0-9]+\.[0-9]+(\.[0-9]+)?$ ]] || continue
              release_tags+=("$tag")
            done < <(git tag --points-at "$commit")
          done

          if ((${#release_tags[@]} > 0)); then
            sorted_tags=()
            while IFS= read -r tag; do
              sorted_tags+=("$tag")
            done < <(printf '%s\n' "${release_tags[@]}" | sort -u)
            release_tags=("${sorted_tags[@]}")
          fi

          if ((${#release_tags[@]} == 0)); then
            echo "No release tags found in the pushed commits."
            exit 0
          fi

          printf 'Release tags: %s\n' "${release_tags[*]}"
          {
            echo 'tags<<EOF'
            printf '%s\n' "${release_tags[@]}"
            echo EOF
          } >> "$GITHUB_OUTPUT"

      - name: Package release assets
        if: steps.tags.outputs.tags != ''
        env:
          RELEASE_TAGS: ${{ steps.tags.outputs.tags }}
        run: |
          while IFS= read -r tag; do
            ./scripts/package-release.sh "$tag" release-artifacts
          done <<< '${{ steps.tags.outputs.tags }}'

      - name: Publish GitHub release
        if: steps.tags.outputs.tags != ''
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAGS: ${{ steps.tags.outputs.tags }}
        run: |
          while IFS= read -r tag; do
            assets=(release-artifacts/*"$tag"*)
            if gh release view "$tag" >/dev/null 2>&1; then
              gh release upload "$tag" "${assets[@]}" --clobber
            else
              gh release create "$tag" "${assets[@]}" --generate-notes --verify-tag
            fi
          done <<< "$RELEASE_TAGS"
